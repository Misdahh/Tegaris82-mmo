name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Android APK with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.0.43f1
          targetPlatform: Android
          buildMethod: BuildScript.BuildAndroid
          buildsPath: build
          buildName: tegaris82
          versioning: Semantic
          allowDirtyBuild: true
          customParameters: "-quit -batchmode"

      - name: Show generated files
        if: always()
        shell: bash
        run: |
          echo "=== build directory ==="
          find build -maxdepth 4 -type f 2>/dev/null || true
          echo "=== Unity diagnostics ==="
          find Logs/UnityDiagnostics -maxdepth 3 -type f 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tegaris82-android
          path: build/**/*.apk
          if-no-files-found: error

      - name: Upload Unity diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tegaris82-unity-diagnostics
          path: Logs/UnityDiagnostics/**
          if-no-files-found: ignore
