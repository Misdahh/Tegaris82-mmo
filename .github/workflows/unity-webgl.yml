name: Build tegaris82 WebGL

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-webgl:
    name: Build WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Validate Unity secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$UNITY_LICENSE" || { echo "ERROR: UNITY_LICENSE is missing."; exit 1; }
          test -n "$UNITY_EMAIL" || { echo "ERROR: UNITY_EMAIL is missing."; exit 1; }
          test -n "$UNITY_PASSWORD" || { echo "ERROR: UNITY_PASSWORD is missing."; exit 1; }
          echo "Unity secrets are present. Values are not printed for security."

      - name: Build WebGL with Unity
        id: unity-build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.0.43f1
          targetPlatform: WebGL
          buildsPath: build
          buildName: tegaris82-webgl
          versioning: Semantic
          collectUnityLogs: true
          streamUnityLogs: true

      - name: Show generated files
        if: always()
        shell: bash
        run: |
          echo "=== build directory ==="
          find build -maxdepth 4 -type f -print 2>/dev/null || true
          echo "=== Unity diagnostics ==="
          find Logs/UnityDiagnostics -maxdepth 3 -type f -print 2>/dev/null || true

      - name: Upload WebGL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tegaris82-webgl
          path: build/WebGL
          if-no-files-found: error

      - name: Upload Unity diagnostics if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tegaris82-webgl-unity-diagnostics
          path: Logs/UnityDiagnostics/
          if-no-files-found: warn
